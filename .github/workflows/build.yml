name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL "https://repo.maven.apache.org/maven2/org/gradle/gradle-wrapper/8.8/gradle-wrapper-8.8.jar" \
            -o gradle/wrapper/gradle-wrapper.jar || \
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.8-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar || \
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar || \
          (echo "All download attempts failed" && exit 1)
          echo "Wrapper JAR size: $(stat -c%s gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: List build outputs
        run: ls -la build/libs/

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multiactionkeybind-jars
          path: |
            build/libs/*.jar
          retention-days: 30

      - name: Upload release JAR (remapped)
        uses: actions/upload-artifact@v4
        with:
          name: multiactionkeybind-release
          path: |
            build/libs/*[!sources][!dev].jar
          if-no-files-found: warn
          retention-days: 90
